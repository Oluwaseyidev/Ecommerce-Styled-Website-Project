<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunny's Store - Contact</title>
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo-container">
        <img class="logo1" src="logo1.png" alt="logo icon" />
        <h1 class="logo-text">Sunny's Store</h1>
      </div>
      <nav>
        <ul class="listed">
          <li>
            <a href="index.html">Home</a>
          </li>
          <li>
            <a href="product.html">Books</a>
          </li>
          <li>
            <a href="contact.html">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2><font color="darkblue">Contact Us</font></h2>
        <form action="#" method="post">
          <p>
            <label for="name"><font color="brown">Full Name:</font></label
            ><br />
            <input type="text" id="name" name="name" required />
          </p>
          <p>
            <label for="email"><font color="brown">Email Address:</font></label
            ><br />
            <input type="email" id="email" />
          </p>
          <p>
            <label for="message"><font color="brown">Message:</font></label
            ><br />
            <textarea id="message" rows="5" cols="50" required></textarea>
          </p>
          <p>
            <button type="submit">Send Message</button>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
